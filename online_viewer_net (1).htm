<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Music Embed Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #cc0000;
        }
        .player-container {
            margin-top: 25px;
            display: none;
        }
        /* Mengatur ukuran iframe agar hanya terlihat seperti bar pemutar musik (audio saja) */
        iframe {
            border-radius: 8px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .share-link {
            margin-top: 15px;
            padding: 10px;
            background: #eef2f3;
            border-radius: 6px;
            font-size: 14px;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube Music Embed</h2>
    <p>Masukkan link YouTube untuk menghasilkan pemutar musik minimalis</p>
    
    <input type="text" id="youtubeUrl" placeholder="Tempel link YouTube di sini...">
    <button onclick="generateEmbed()">Generate Player</button>

    <!-- Tempat Pemutar Musik -->
    <div class="player-container" id="playerContainer">
        <iframe id="musicPlayer" width="100%" height="80" src="" allow="autoplay"></iframe>
    </div>

    <!-- Link Khusus untuk dibagikan -->
    <div class="share-link" id="shareLinkContainer">
        <strong>Link Embed Anda:</strong>
        <p id="shareUrl"></p>
    </div>
</div>

<script>
    // Fungsi untuk mengambil ID Video dari berbagai format link YouTube
    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function generateEmbed() {
        const urlInput = document.getElementById('youtubeUrl').value;
        const videoId = extractVideoID(urlInput);

        if (videoId) {
            // Membuat URL embed dengan parameter tambahan agar langsung putar otomatis (autoplay)
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}`;
            
            // Tampilkan pemutar musik (tinggi diatur 80px agar video tersembunyi dan hanya terlihat seperti bar audio)
            const player = document.getElementById('musicPlayer');
            player.src = embedUrl;
            document.getElementById('playerContainer').style.display = 'block';

            // Menghasilkan link play music mandiri (bisa dikirim atau disimpan)
            const directPlayUrl = window.location.href.split('?')[0] + `?v=${videoId}`;
            document.getElementById('shareUrl').innerText = directPlayUrl;
            document.getElementById('shareLinkContainer').style.style.display = 'block';
        } else {
            alert('Tolong masukkan link YouTube yang valid.');
        }
    }

    // Otomatis memutar jika link dibuka menggunakan parameter ?v=ID_VIDEO
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        if (videoId) {
            document.getElementById('youtubeUrl').value = `https://www.youtube.com/watch?v=${videoId}`;
            generateEmbed();
        }
    }
</script>

</body>
</html>
